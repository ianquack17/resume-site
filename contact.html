<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact</title>
        <link rel="stylesheet" href="style.css">
        <script src="site.js" defer></script>
        <script src="https://kit.fontawesome.com/171234e241.js" crossorigin="anonymous"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="header">
            <div><a href="index.html" class="logo">Ian Quack</a></div>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <nav class="nav" id="site-nav" aria-label="Primary navigation">
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html" aria-current="page">Contact</a>
            </nav>
        </div>
        <div class="wrapper">
            <div class="about-banner">
                <div class="about-banner-content">
                    <h1><strong>Contact</strong></h1>
                    <p>Where to reach me</p>
                </div>
            </div>
            <div class="contact-card">
                <form id="contact-form">
                    <label for="name">Your name</label>
                    <input id="name" type="text" name="name" autocomplete="name" placeholder="Ian Quack" required>
                    <label for="email">Your email</label>
                    <input id="email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                    <label for="message">Your message</label>
                    <textarea id="message" name="message" placeholder="How can I help?" required></textarea>
                    <button type="submit"><i class="fa-solid fa-paper-plane"></i> Send</button>
                </form>
                <div id="form-feedback" class="form-feedback"></div>
            </div>
            <script>
                const form = document.getElementById("contact-form")

                form.addEventListener("submit", async (e) => {
                    e.preventDefault();

                    const formData = new FormData(form);
                    const data = {
                        name: formData.get("name"),
                        email: formData.get("email"),
                        message: formData.get("message")
                    };

                    const feedback = document.getElementById("form-feedback");
                    feedback.textContent = "";
                    feedback.className = "form-feedback";

                    try {
                        const response = await fetch("https://resume-backend-yhog.onrender.com/contact", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(data)
                        });

                        if (response.ok) {
                            feedback.textContent = "Message sent!";
                            feedback.classList.add("success");
                            form.reset();
                        } else {
                            feedback.textContent = "There was a problem sending your message.";
                            feedback.classList.add("error");
                        }
                    } catch (err) {
                        feedback.textContent = "There was a problem sending your message.";
                        feedback.classList.add("error");
                    }
                });
            </script>
        </div>
        <footer class="site-footer">
            <p>&copy 2025 Ian Quack. All rights reserved.</p>
            <a href="https://www.linkedin.com/in/ianquack" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
        </footer>
    </body>
</html>
